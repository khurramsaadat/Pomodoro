[package]
name = "pomodoro"
version = "0.1.0"
description = "A focused Pomodoro timer for the desktop."
authors = ["Khurram"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "pomodoro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "windows")'.dependencies]
# The Windows notification system needs to know the app by name, and the
# registration is a registry key.
windows-registry = "0.5"

[profile.release]
# The timer is a small program that is expected to be running all day, so
# the size of the binary matters more than the last millisecond of speed.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
