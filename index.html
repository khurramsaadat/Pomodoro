<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A focused Pomodoro timer for the web and the desktop." />
    <meta name="theme-color" content="#0b1020" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Pomodoro</title>
    <script>
      // Applies the persisted theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('pomodoro-theme');
          var isDark =
            stored === 'dark' ||
            ((stored === 'system' || stored === null) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) {
          /* storage unavailable, so fall back to the light theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
